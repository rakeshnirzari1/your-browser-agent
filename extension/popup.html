<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 300px; font-family: system-ui, sans-serif; margin: 0; padding: 14px; color: #1f2328; }
    h1 { font-size: 15px; margin: 0 0 2px; }
    .sub { font-size: 11px; color: #6b7280; margin-bottom: 12px; }
    .row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #d1d5db; flex: none; }
    .dot.ok { background: #16a34a; }
    .dot.bad { background: #dc2626; }
    .state { font-size: 12px; }
    label { font-size: 11px; color: #6b7280; display: block; margin: 10px 0 3px; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 12px; }
    button { margin-top: 10px; width: 100%; padding: 7px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 12px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .hint { font-size: 10.5px; color: #6b7280; margin-top: 10px; line-height: 1.5; }
    code { background: #f3f4f6; padding: 0 3px; border-radius: 3px; font-size: 10.5px; }
  </style>
</head>
<body>
  <h1>Your Browser Agent</h1>
  <div class="sub">Lets your AI agent drive this browser.</div>

  <div class="row">
    <span id="dot" class="dot"></span>
    <span id="state" class="state">checking…</span>
  </div>

  <label for="url">Relay address</label>
  <input id="url" type="text" spellcheck="false" placeholder="ws://127.0.0.1:7799/ext" />

  <button id="connect">Connect</button>

  <div class="hint">
    1. Start the relay: <code>node relay.js</code> (in the relay folder)<br />
    2. Press <b>Connect</b> here<br />
    3. Tell your agent the instructions in <code>AGENT-INSTRUCTIONS.md</code>
  </div>

  <script src="popup.js"></script>
</body>
</html>
