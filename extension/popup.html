<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 300px; font-family: system-ui, sans-serif; margin: 0; padding: 16px; color: #1f2328; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand img { width: 20px; height: 20px; }
    .brand span { font-size: 14px; font-weight: 600; }
    .help { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #d1d5db; color: #6b7280; text-decoration: none; font-size: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
    .help:hover { background: #f3f4f6; }
    .status { font-size: 12px; color: #6b7280; margin-bottom: 10px; min-height: 15px; }
    .status.ok { color: #15803d; }
    .status.bad { color: #b91c1c; }
    .toggle { width: 100%; padding: 11px; border: 0; border-radius: 8px; background: #111827; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
    .toggle:hover { background: #000; }
    .toggle:disabled { opacity: 0.6; cursor: default; }
    .toggle.connected { background: #15803d; }
    .toggle.connected:hover { background: #166534; }
    details.advanced { margin-top: 12px; }
    details.advanced summary { font-size: 11px; color: #6b7280; cursor: pointer; }
    details.advanced label { font-size: 11px; color: #6b7280; display: block; margin: 8px 0 3px; }
    details.advanced input[type="text"] { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon48.png" alt="" />
      <span>Your Browser Agent</span>
    </div>
    <a class="help" href="https://github.com/rakeshnirzari1/your-browser-agent" target="_blank" rel="noopener" title="Setup guide">?</a>
  </div>

  <div class="status" id="status">Checking…</div>

  <button id="toggle" class="toggle">Connect</button>

  <details class="advanced">
    <summary>Advanced</summary>
    <label for="url">MCP server address</label>
    <input id="url" type="text" spellcheck="false" placeholder="ws://127.0.0.1:7799/ext" />
  </details>

  <script src="popup.js"></script>
</body>
</html>
